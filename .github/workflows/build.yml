name: Compilar Plugins PS4 GoldHEN

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps4dev/ps4sdk:latest

    steps:
      - name: Instalar git
        run: |
          apt-get update -qq && apt-get install -y -qq git make curl

      - name: Clonar repositorio
        run: |
          git clone https://github.com/GODSTUDIOS-web/noTrack-ps4-plugins.git /workspace
          ls -la /workspace

      - name: Verificar toolchain
        run: |
          cd /workspace
          clang --version
          echo "PS4SDK=$PS4SDK"
          ls -la /PS4SDK/include/ 2>/dev/null || echo "SDK headers nao estao em /PS4SDK/include"

      - name: Baixar headers PS4 se nao existirem
        run: |
          if [ ! -d "/PS4SDK/include/ps4" ]; then
            mkdir -p /PS4SDK/include/ps4
            cd /PS4SDK/include/ps4
            curl -sL https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/kernel.h -o kernel.h
            curl -sL https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/pthread.h -o pthread.h
            curl -sL https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/sce_module.h -o sce_module.h
            curl -sL https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/sce_sysmodule.h -o sce_sysmodule.h
            ls -la /PS4SDK/include/ps4/
          fi

      - name: Compilar plugins
        run: |
          cd /workspace
          make PS4SDK=/PS4SDK clean all

      - name: Listar artefatos
        run: |
          cd /workspace
          ls -lh *.prx

      - name: Upload .prx
        uses: actions/upload-artifact@v4
        with:
          name: ps4-plugins
          path: /workspace/*.prx
          if-no-files-found: error