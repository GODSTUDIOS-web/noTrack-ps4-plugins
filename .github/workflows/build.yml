name: Compilar Plugins PS4 GoldHEN

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Permite executar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps4dev/ps4sdk:latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Verificar toolchain
        run: |
          clang --version
          echo "PS4SDK=$PS4SDK"
          ls -la $PS4SDK/include/ || echo "SDK include nao encontrado"

      - name: Compilar plugins
        run: |
          make clean
          make

      - name: Listar artefatos gerados
        run: |
          echo "=== PRX gerados ==="
          ls -lh *.prx 2>/dev/null || echo "Nenhum .prx encontrado"

      - name: Fazer upload dos .prx como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ps4-plugins
          path: |
            *.prx
          if-no-files-found: error