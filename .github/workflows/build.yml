name: Compilar Plugins PS4 GoldHEN

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar clang PS4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-14 binutils make
          ln -sf /usr/bin/clang-14 /usr/bin/clang

      - name: Baixar headers PS4
        run: |
          mkdir -p /tmp/ps4sdk/include/ps4
          cd /tmp/ps4sdk/include/ps4
          for f in kernel.h pthread.h sce_module.h sce_sysmodule.h; do
            curl -sL "https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/$f" -o "$f"
          done
          ls -la

      - name: Compilar
        run: |
          make PS4SDK=/tmp/ps4sdk CC=clang-14 clean all

      - name: Listar PRX
        run: ls -lh *.prx

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ps4-plugins
          path: |
            *.prx
          if-no-files-found: error