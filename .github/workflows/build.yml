name: Compilar Plugins PS4 GoldHEN

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Instalar clang e binutils
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang binutils gcc-multilib make

      - name: Baixar headers PS4
        run: |
          mkdir -p /tmp/ps4sdk/include/ps4
          cd /tmp/ps4sdk/include/ps4
          curl -sL https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/kernel.h -o kernel.h
          curl -sL https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/pthread.h -o pthread.h
          curl -sL https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/sce_module.h -o sce_module.h
          curl -sL https://raw.githubusercontent.com/ps4home/ps4sdk/master/include/ps4/sce_sysmodule.h -o sce_sysmodule.h
          ls -la /tmp/ps4sdk/include/ps4/

      - name: Compilar plugins
        run: |
          make PS4SDK=/tmp/ps4sdk clean all

      - name: Listar artefatos gerados
        run: |
          echo "=== PRX gerados ==="
          ls -lh *.prx

      - name: Fazer upload dos .prx como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ps4-plugins
          path: |
            *.prx
          if-no-files-found: error